<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicinal Plant Classifier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .status-card {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-card.loading {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }

        .status-card.error {
            border-left-color: #ef4444;
            background: #fef2f2;
        }

        .status-card.success {
            border-left-color: #10b981;
            background: #f0fdf4;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3b82f6;
            animation: pulse 2s infinite;
        }

        .status-card.loading .status-indicator {
            background: #f59e0b;
        }

        .status-card.error .status-indicator {
            background: #ef4444;
        }

        .status-card.success .status-indicator {
            background: #10b981;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .image-preview {
            width: 100%;
            height: 300px;
            background: #f3f4f6;
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px 0;
            overflow: hidden;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview.empty {
            color: #999;
            font-size: 14px;
        }

        .buttons-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .buttons-group.full {
            grid-template-columns: 1fr;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #4b5563;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-card {
            background: #f0fdf4;
            border: 2px solid #10b981;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            display: none;
        }

        .result-card.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-plant-name {
            color: #059669;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .confidence-bar {
            background: #e5e7eb;
            border-radius: 8px;
            height: 24px;
            overflow: hidden;
            margin-top: 8px;
        }

        .confidence-fill {
            background: linear-gradient(90deg, #10b981, #059669);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            transition: width 0.5s ease;
        }

        input[type="file"] {
            display: none;
        }

        .predictions-list {
            margin-top: 16px;
            max-height: 200px;
            overflow-y: auto;
        }

        .prediction-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
        }

        .prediction-item:last-child {
            border-bottom: none;
        }

        .prediction-name {
            color: #374151;
            font-weight: 500;
        }

        .prediction-score {
            color: #6b7280;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f4f6;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
            font-size: 13px;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌿 Plant Classifier</h1>
            <p class="subtitle">Identify medicinal plants with AI</p>
        </header>

        <div class="status-card" id="statusCard">
            <div class="status-indicator"></div>
            <span id="statusText">Connecting to server...</span>
        </div>

        <div class="image-preview empty" id="imagePreview">
            <span>📷 Select an image</span>
        </div>

        <div class="buttons-group">
            <button class="btn-primary" onclick="selectFromGallery()">📁 Gallery</button>
            <button class="btn-primary" onclick="captureFromCamera()">📸 Camera</button>
        </div>

        <div class="buttons-group full">
            <button class="btn-primary" onclick="analyzeImage()" id="analyzeBtn" disabled>✓ Analyze</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-card" id="resultCard">
            <div class="result-plant-name" id="plantName"></div>
            <div style="color: #6b7280; font-size: 13px; margin-bottom: 8px;">Confidence</div>
            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
            </div>
            <div class="predictions-list" id="predictionsList"></div>
        </div>

        <button class="btn-secondary" onclick="clearImage()" style="width: 100%; margin-top: 16px; display: none;" id="clearBtn">Clear</button>
    </div>

    <script>
        const API_URL = 'https://medicinal-plant-classifier.onrender.com';
        let selectedFile = null;

        // Check server on load
        window.addEventListener('load', async () => {
            try {
                const res = await fetch(`${API_URL}/health`);
                if (res.ok) {
                    updateStatus('✅ Model Ready', 'success');
                } else {
                    updateStatus('⚠️ Server Error', 'error');
                }
            } catch (e) {
                updateStatus('❌ Server Offline', 'error');
            }
        });

        function updateStatus(text, type = 'loading') {
            const card = document.getElementById('statusCard');
            card.className = `status-card ${type}`;
            document.getElementById('statusText').textContent = text;
        }

        function selectFromGallery() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    selectedFile = file;
                    displayImage(file);
                }
            };
            input.click();
        }

        async function captureFromCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();

                const canvas = document.createElement('canvas');
                canvas.width = 224;
                canvas.height = 224;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                canvas.toBlob((blob) => {
                    selectedFile = blob;
                    displayImage(blob);
                });

                stream.getTracks().forEach(track => track.stop());
            } catch (e) {
                showError('Camera access denied');
            }
        }

        function displayImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = `<img src="${e.target.result}" />`;
                preview.classList.remove('empty');
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('clearBtn').style.display = 'block';
                document.getElementById('resultCard').classList.remove('show');
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage() {
            if (!selectedFile) return;

            updateStatus('🔄 Analyzing...', 'loading');
            document.getElementById('analyzeBtn').disabled = true;

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (data.success) {
                    displayResults(data);
                    updateStatus('✅ Analysis Complete', 'success');
                } else {
                    showError(data.error || 'Prediction failed');
                    updateStatus('❌ Analysis Failed', 'error');
                }
            } catch (e) {
                showError(e.message);
                updateStatus('❌ Error', 'error');
            }

            document.getElementById('analyzeBtn').disabled = false;
        }

        function displayResults(data) {
            document.getElementById('plantName').textContent = data.predicted_class.replace(/_/g, ' ');

            const confidence = Math.round(data.confidence * 100);
            const fill = document.getElementById('confidenceFill');
            fill.style.width = confidence + '%';
            fill.textContent = confidence + '%';

            const predictions = document.getElementById('predictionsList');
            predictions.innerHTML = '';

            Object.entries(data.all_predictions)
                .sort((a, b) => b[1] - a[1])
                .forEach(([plant, score]) => {
                    const item = document.createElement('div');
                    item.className = 'prediction-item';
                    item.innerHTML = `
                        <span class="prediction-name">${plant.replace(/_/g, ' ')}</span>
                        <span class="prediction-score">${Math.round(score * 100)}%</span>
                    `;
                    predictions.appendChild(item);
                });

            document.getElementById('resultCard').classList.add('show');
        }

        function clearImage() {
            selectedFile = null;
            document.getElementById('imagePreview').innerHTML = '<span>📷 Select an image</span>';
            document.getElementById('imagePreview').classList.add('empty');
            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('clearBtn').style.display = 'none';
            document.getElementById('resultCard').classList.remove('show');
            document.getElementById('errorMessage').classList.remove('show');
        }

        function showError(msg) {
            const err = document.getElementById('errorMessage');
            err.textContent = '❌ ' + msg;
            err.classList.add('show');
        }
    </script>
</body>
</html>
